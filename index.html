const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const k = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:bytes(P.salt), iterations:P.it}, base, 512));
  const iv = bytes(P.iv), ct = bytes(P.ct), signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  const hk = await crypto.subtle.importKey('raw', k.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', hk, bytes(P.mac), signed)) return null;
  const ak = await crypto.subtle.importKey('raw', k.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv}, ak, ct));
